
name: StoredIn

services:
  app:
    build: .
    volumes:
      - ./paste:/app/paste
    ports:
      - "3000:3000"
    environment:
      - APP_NAME=${APP_NAME}
      - PORT=${PORT}
      - DOMAIN=${DOMAIN}
      - DEV=${DEV}
      - FILENAME_LENGTH=${FILENAME_LENGTH}
    restart: unless-stopped
